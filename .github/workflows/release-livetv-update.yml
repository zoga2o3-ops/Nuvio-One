name: Release Nuvio One update

# Publishes an update of your fork between Nuvio releases, for example after you
# change Live TV. Run it from the Actions tab. It picks the next version number
# automatically so the app's built-in updater offers it:
#   Nuvio 1.1.0-beta.2  ->  1.1.0-beta.2.1, 1.1.0-beta.2.2, ...
#   Nuvio 1.2.0         ->  1.2.1-livetv.1, 1.2.1-livetv.2, ...
# The next real Nuvio release always counts as newer than these.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What changed (shown in the update prompt)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version number
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE=$(grep -m1 -E '^\s*versionName = "' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          if [ -z "$BASE" ]; then echo "Couldn't read versionName from app/build.gradle.kts" >&2; exit 1; fi
          if [[ "$BASE" == *-* ]]; then
            PREFIX="$BASE."
          else
            IFS=. read -r MA MI PA <<< "$BASE"
            PREFIX="$MA.$MI.$((PA + 1))-livetv."
          fi
          LAST=$(gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' \
            | grep -F "$PREFIX" | sed "s/^$(printf '%s' "$PREFIX" | sed 's/[.[\*^$/]/\\&/g')//" \
            | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          N=$(( ${LAST:-0} + 1 ))
          if [ "$N" -gt 99 ]; then echo "Too many fork builds on one Nuvio version (max 99)" >&2; exit 1; fi
          VERSION="$PREFIX$N"
          echo "Nuvio base $BASE -> fork release $VERSION (build $N)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "number=$N" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Write app keys
        env:
          NUVIO_BACKEND_URL: ${{ secrets.NUVIO_BACKEND_URL }}
          NUVIO_BACKEND_KEY: ${{ secrets.NUVIO_BACKEND_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_APP_NAME: ${{ secrets.SIMKL_APP_NAME }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          PREMIUMIZE_CLIENT_ID: ${{ secrets.PREMIUMIZE_CLIENT_ID }}
          # IMDb ratings (episode ratings and the rating on details pages) come from Nuvio's
          # ratings services; without these the app has nowhere to ask, so no ratings show.
          IMDB_RATINGS_API_BASE_URL: ${{ secrets.IMDB_RATINGS_API_BASE_URL }}
          IMDB_TAPFRAME_API_BASE_URL: ${{ secrets.IMDB_TAPFRAME_API_BASE_URL }}
          # Skip intro: IntroDB (introdb.app), a free and open timestamp service (no key needed to
          # read). A secret can point it elsewhere; otherwise the public address is used.
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          DEBUG_REPORT_DISCORD_WEBHOOK: ${{ secrets.DEBUG_REPORT_DISCORD_WEBHOOK }}
          PLAYBACK_REPORTS_BASE_URL: ${{ secrets.PLAYBACK_REPORTS_BASE_URL }}
          TRAILER_API_URL: ${{ secrets.TRAILER_API_URL }}
          SUPPORTERS_API_BASE_URL: ${{ secrets.SUPPORTERS_API_BASE_URL }}
          SUPPORT_URL: ${{ secrets.SUPPORT_URL }}
          AVATAR_PUBLIC_BASE_URL: ${{ secrets.AVATAR_PUBLIC_BASE_URL }}
        run: |
          if [ -z "$NUVIO_BACKEND_URL" ] || [ -z "$NUVIO_BACKEND_KEY" ]; then
            echo "::error::NUVIO_BACKEND_URL and NUVIO_BACKEND_KEY must be set. Without them Nuvio account and QR login do not work."
            exit 1
          fi
          : > keys.properties
          add() { if [ -n "$2" ]; then echo "$1=$2" >> keys.properties; fi; }
          if [ -n "$NUVIO_BACKEND_URL" ]; then
            BACKEND="${NUVIO_BACKEND_URL%/}"
            add NUVIO_SUPABASE_URL "$BACKEND"
            add NUVIO_SUPABASE_ANON_KEY "$NUVIO_BACKEND_KEY"
            add NUVIO_SUPABASE_FALLBACK_URL "$NUVIO_SUPABASE_FALLBACK_URL"
            case "$BACKEND" in
              *api.nuvio.tv*)
                # Official Nuvio accounts: the app's built-in nuvio.tv login pages are already right.
                ;;
              *)
                # Self-hosted server: its login pages live on the server itself.
                add TV_LOGIN_WEB_BASE_URL "$BACKEND/tv-login"
                add DEVICE_LOGIN_WEB_BASE_URL "$BACKEND/link"
                add AVATAR_PUBLIC_BASE_URL "$BACKEND/storage/v1/object/public/avatars"
                ;;
            esac
          fi
          add TMDB_API_KEY "$TMDB_API_KEY"
          add TRAKT_CLIENT_ID "$TRAKT_CLIENT_ID"
          add TRAKT_CLIENT_SECRET "$TRAKT_CLIENT_SECRET"
          add SIMKL_CLIENT_ID "$SIMKL_CLIENT_ID"
          add SIMKL_APP_NAME "$SIMKL_APP_NAME"
          add MDBLIST_CLIENT_ID "$MDBLIST_CLIENT_ID"
          add GOOGLE_DRIVE_CLIENT_ID "$GOOGLE_DRIVE_CLIENT_ID"
          add GOOGLE_DRIVE_CLIENT_SECRET "$GOOGLE_DRIVE_CLIENT_SECRET"
          add PREMIUMIZE_CLIENT_ID "$PREMIUMIZE_CLIENT_ID"
          add IMDB_RATINGS_API_BASE_URL "$IMDB_RATINGS_API_BASE_URL"
          add IMDB_TAPFRAME_API_BASE_URL "$IMDB_TAPFRAME_API_BASE_URL"
          add INTRODB_API_URL "${INTRODB_API_URL:-https://api.introdb.app/}"
          add LASTFM_API_KEY "$LASTFM_API_KEY"
          add LASTFM_SECRET "$LASTFM_SECRET"
          add DEBUG_REPORT_DISCORD_WEBHOOK "$DEBUG_REPORT_DISCORD_WEBHOOK"
          add PLAYBACK_REPORTS_BASE_URL "$PLAYBACK_REPORTS_BASE_URL"
          add TRAILER_API_URL "$TRAILER_API_URL"
          add SUPPORTERS_API_BASE_URL "$SUPPORTERS_API_BASE_URL"
          add SUPPORT_URL "$SUPPORT_URL"
          add AVATAR_PUBLIC_BASE_URL "$AVATAR_PUBLIC_BASE_URL"
          # The build reads some values from each file, so write both.
          cp keys.properties local.properties
          cp keys.properties local.dev.properties
          rm keys.properties
          echo "Keys set:"; cut -d= -f1 local.properties

      - name: Signing
        run: |
          cp keystore/livetv-fork.jks "$RUNNER_TEMP/key.jks"
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/key.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=livetv"
            echo "NUVIO_RELEASE_KEY_PASSWORD=livetvfork"
            echo "NUVIO_RELEASE_STORE_PASSWORD=livetvfork"
          } >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFullRelease --stacktrace \
            -PlivetvBuildNumber=${{ steps.version.outputs.number }} \
            -PlivetvVersionName=${{ steps.version.outputs.version }}

      - name: Collect APKs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out
          for f in $(find app/build/outputs/apk/full/release -name "*.apk"); do
            name=$(basename "$f" .apk)
            cp "$f" "out/NuvioOne-$VERSION-${name#app-full-}.apk"
          done
          ls -la out

      - name: Choose release notes
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > release_body.md
          else
            cp RELEASE_NOTES.md release_body.md
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Nuvio One ${{ steps.version.outputs.version }}
          prerelease: false
          make_latest: true
          files: |
            out/*.apk
          body_path: release_body.md
